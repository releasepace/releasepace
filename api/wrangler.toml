name = "api"
main = "src/index.ts"
compatibility_date = "2024-02-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# ── Secrets (set via: wrangler secret put SUPABASE_URL) ──────
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# SUPABASE_JWT_SECRET

[vars]
ALLOWED_ORIGINS = "*"

[env.production]
name = "api-prod"

[env.preview]
name = "api-preview"
