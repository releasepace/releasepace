name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    name: API typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  dashboard-check:
    name: Dashboard typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_API_URL: https://api.releasepace.io

  migration-check:
    name: SQL syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pg_format
        run: sudo apt-get install -y pgformatter
      - name: Check SQL formatting
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f..."
            pg_format "$f" > /dev/null && echo "OK: $f"
          done

  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [api-check, dashboard-check, migration-check]
    steps:
      - run: echo "All platform checks passed"
