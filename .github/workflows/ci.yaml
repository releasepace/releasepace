name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    name: API typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ── Dashboard ──────────────────────────────────────────────────
  dashboard-check:
    name: Dashboard typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_API_URL: https://api.releasepace.io

  # ── DB migration syntax check ──────────────────────────────────
  # SDKs live in their own repos (releasepace-js, releasepace-python,
  # releasepace-go, releasepace-java) and are tested there.
  # The bucketing-vectors.json fixture is the cross-SDK contract;
  # each SDK repo asserts against it independently in its own CI.
  migration-check:
    name: SQL syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pg_format
        run: sudo apt-get install -y pgformatter
      - name: Check SQL syntax
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f..."
            pg_format "$f" > /dev/null && echo "OK: $f"
          done

  # ── Summary ────────────────────────────────────────────────────
  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [api-check, dashboard-check, migration-check]
    steps:
      - run: echo "All checks passed ✅"
