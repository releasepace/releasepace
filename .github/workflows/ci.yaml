name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── API ────────────────────────────────────────────────────────
  api-check:
    name: API typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # ── Dashboard ──────────────────────────────────────────────────
  dashboard-check:
    name: Dashboard typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_API_URL: https://api.releasepace.io

  # ── JS SDK ─────────────────────────────────────────────────────
  sdk-js-check:
    name: JS SDK typecheck, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # ── Python SDK ─────────────────────────────────────────────────
  sdk-python-check:
    name: Python SDK lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[requests]" ruff pytest
      - name: Lint
        run: ruff check releasepace/
      - name: Test
        run: pytest tests/ -v

  # ── Go SDK ─────────────────────────────────────────────────────
  sdk-go-check:
    name: Go SDK vet, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: sdks/go/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v

  # ── Java SDK ───────────────────────────────────────────────────
  sdk-java-check:
    name: Java SDK compile & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Test
        run: mvn --no-transfer-progress test

  # ── DB migration check ─────────────────────────────────────────
  migration-check:
    name: SQL syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pg_format
        run: sudo apt-get install -y pgformatter
      - name: Check SQL formatting
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f..."
            pg_format "$f" > /dev/null && echo "OK: $f"
          done

  # ── Summary ────────────────────────────────────────────────────
  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [api-check, dashboard-check, sdk-js-check, sdk-python-check, sdk-go-check, sdk-java-check]
    steps:
      - run: echo "All checks passed ✅"
