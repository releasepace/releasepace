name: Publish SDKs

on:
  push:
    tags:
      - 'sdk/js/v*'       # triggers js publish    e.g. sdk/js/v1.0.1
      - 'sdk/python/v*'   # triggers python publish e.g. sdk/python/v1.0.1
      - 'sdk/java/v*'     # triggers java publish   e.g. sdk/java/v1.0.1
      - 'sdk/go/v*'       # Go is published via tag on the repo root

permissions:
  contents: write

jobs:
  # ── JavaScript SDK → npm ──────────────────────────────────────
  publish-js:
    name: Publish releasepace-js to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdk/js/')
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
        with:
          repository: releasepace/releasepace-js
          ref: main
          path: sdks/js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json

      - name: Extract version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#sdk/js/v}"
          npm version "$VERSION" --no-git-tag-version
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `releasepace-js v${{ env.VERSION }}`,
              body: `### releasepace-js v${{ env.VERSION }}\n\nnpm install releasepace-js@${{ env.VERSION }}`,
              draft: false,
              prerelease: false,
            })

  # ── Python SDK → PyPI ─────────────────────────────────────────
  publish-python:
    name: Publish releasepace to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdk/python/')
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
        with:
          repository: releasepace/releasepace-python
          ref: main
          path: sdks/python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#sdk/python/v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Update version in pyproject.toml
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ── Java SDK → Maven Central ──────────────────────────────────
  publish-java:
    name: Publish releasepace-java to Maven Central
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdk/java/')
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
        with:
          repository: releasepace/releasepace-java
          ref: main
          path: sdks/java
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Extract version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#sdk/java/v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Deploy to Maven Central
        run: mvn --no-transfer-progress --batch-mode deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # ── Go SDK — published automatically via GitHub tag ───────────
  # Go modules are versioned by Git tags on the repo.
  # Tag format: sdk/go/v1.0.0
  # pkg.go.dev indexes automatically once the tag is pushed.
  # No publish step needed — just validate it compiles.
  validate-go:
    name: Validate Go SDK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdk/go/')
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
        with:
          repository: releasepace/releasepace-go
          ref: main
          path: sdks/go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Verify module
        run: go vet ./...
      - name: Build
        run: go build ./...
